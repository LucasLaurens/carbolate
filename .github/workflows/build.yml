name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node: ["25"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      - name: Validate package.json and package-lock.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid')"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      # ESLint is not type-aware here, so nothing else in this pipeline would
      # notice a type error: the build transpiles without checking.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build every browser target
        run: |
          for target in chrome firefox; do
            npm run "build:$target"
            node -e "
              const fs = require('fs');
              JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
              for (const file of ['dist/background.js', 'dist/content.js']) {
                if (/\bimport[ {(]/.test(fs.readFileSync(file, 'utf8'))) {
                  throw new Error(file + ' contains an ESM import — unloadable as a classic script');
                }
              }
              console.log('$target bundle is self-contained');
            "
          done
